steps:
- task: PowerShell@2
  displayName: Read build SDK version
  inputs:
    pwsh: true
    targetType: inline
    workingDirectory: '$(Build.SourcesDirectory)'
    script: |
      $sdkVersion = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
      Write-Host "##vso[task.setvariable variable=OrleansBuildSdkVersion]$sdkVersion"
# Resolve the pinned version here so preview SDKs bypass UseDotNet's roll-forward resolver.
- task: UseDotNet@2
  displayName: 'Use .NET Core sdk'
  inputs:
    version: '$(OrleansBuildSdkVersion)'
    includePreviewVersions: true
