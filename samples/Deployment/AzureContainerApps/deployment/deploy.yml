name: Deploy Azure Container Apps sample

on:
  workflow_dispatch:
  push:
    branches:
      - deploy
    paths:
      - .github/workflows/deploy-orleans-container-apps.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - global.json
      - samples/Deployment/AzureContainerApps/**
      - samples/NuGet.config
      - src/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-container-apps-${{ vars.AZURE_RESOURCE_GROUP }}-${{ vars.AZURE_BASE_NAME }}
  cancel-in-progress: false

env:
  SAMPLE_PATH: samples/Deployment/AzureContainerApps
  RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP }}
  BASE_NAME: ${{ vars.AZURE_BASE_NAME }}

jobs:
  deploy:
    name: Build and deploy immutable images
    runs-on: ubuntu-latest
    environment: azure-container-apps
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to Azure using OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment variables
        run: |
          set -euo pipefail
          : "${RESOURCE_GROUP_NAME:?Set AZURE_RESOURCE_GROUP in the azure-container-apps environment.}"
          : "${BASE_NAME:?Set AZURE_BASE_NAME in the azure-container-apps environment.}"
          if [[ ! "$BASE_NAME" =~ ^[a-z][a-z0-9-]{2,11}$ ]]; then
            echo "AZURE_BASE_NAME must be 3-12 lowercase letters, numbers, or hyphens and start with a letter." >&2
            exit 1
          fi
          az group show --name "$RESOURCE_GROUP_NAME" --output none

      - name: Deploy the resource foundation
        id: foundation
        run: |
          set -euo pipefail
          outputs="$(
            az deployment group create \
              --name aca-foundation \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --template-file "$SAMPLE_PATH/Azure/foundation.bicep" \
              --parameters "baseName=$BASE_NAME" \
              --query properties.outputs \
              --output json
          )"
          registry_name="$(jq -r '.registryName.value' <<< "$outputs")"
          registry_server="$(jq -r '.registryLoginServer.value' <<< "$outputs")"
          test -n "$registry_name"
          test -n "$registry_server"
          echo "registry-name=$registry_name" >> "$GITHUB_OUTPUT"
          echo "registry-server=$registry_server" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ steps.foundation.outputs.registry-name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push the silo image
        id: silo
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: samples/Deployment/AzureContainerApps/Silo/Dockerfile
          push: true
          tags: ${{ steps.foundation.outputs.registry-server }}/silo:${{ github.sha }}

      - name: Build and push the dashboard image
        id: dashboard
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: samples/Deployment/AzureContainerApps/Dashboard/Dockerfile
          push: true
          tags: ${{ steps.foundation.outputs.registry-server }}/dashboard:${{ github.sha }}

      - name: Build and push the Minimal API image
        id: minimal-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: samples/Deployment/AzureContainerApps/Clients.MinimalApi/Dockerfile
          push: true
          tags: ${{ steps.foundation.outputs.registry-server }}/minimal-api:${{ github.sha }}

      - name: Build and push the worker image
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: samples/Deployment/AzureContainerApps/Clients.WorkerService/Dockerfile
          push: true
          tags: ${{ steps.foundation.outputs.registry-server }}/worker:${{ github.sha }}

      - name: Build and push the scaler image
        id: scaler
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: samples/Deployment/AzureContainerApps/Scaler/Dockerfile
          push: true
          tags: ${{ steps.foundation.outputs.registry-server }}/scaler:${{ github.sha }}

      - name: Deploy Container Apps using image digests
        env:
          REGISTRY_SERVER: ${{ steps.foundation.outputs.registry-server }}
          SILO_DIGEST: ${{ steps.silo.outputs.digest }}
          DASHBOARD_DIGEST: ${{ steps.dashboard.outputs.digest }}
          MINIMAL_API_DIGEST: ${{ steps.minimal-api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SCALER_DIGEST: ${{ steps.scaler.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "$SILO_DIGEST" "$DASHBOARD_DIGEST" "$MINIMAL_API_DIGEST" "$WORKER_DIGEST" "$SCALER_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "The image build did not return a valid sha256 digest." >&2
              exit 1
            fi
          done
          az deployment group create \
            --name "aca-${GITHUB_SHA:0:12}" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --template-file "$SAMPLE_PATH/Azure/main.bicep" \
            --parameters \
              "baseName=$BASE_NAME" \
              "siloImage=$REGISTRY_SERVER/silo@$SILO_DIGEST" \
              "dashboardImage=$REGISTRY_SERVER/dashboard@$DASHBOARD_DIGEST" \
              "minimalApiClientImage=$REGISTRY_SERVER/minimal-api@$MINIMAL_API_DIGEST" \
              "workerServiceClientImage=$REGISTRY_SERVER/worker@$WORKER_DIGEST" \
              "scalerImage=$REGISTRY_SERVER/scaler@$SCALER_DIGEST" \
            --output none
