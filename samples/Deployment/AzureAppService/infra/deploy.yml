name: Deploy Orleans shopping cart to Azure App Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - global.json
      - samples/Deployment/AzureAppService/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-app-service-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_NAME: ${{ vars.AZURE_APP_NAME }}
      APP_SERVICE_OS: ${{ vars.AZURE_APP_SERVICE_OS }}
      AUTHENTICATION_CLIENT_ID: ${{ vars.AUTHENTICATION_CLIENT_ID }}
      AUTHENTICATION_TENANT_ID: ${{ vars.AUTHENTICATION_TENANT_ID }}
      AZURE_RESOURCE_GROUP_LOCATION: ${{ vars.AZURE_RESOURCE_GROUP_LOCATION }}
      AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Publish application
        shell: bash
        run: |
          dotnet publish \
            samples/Deployment/AzureAppService/Silo/Orleans.ShoppingCart.Silo.csproj \
            --configuration Release \
            --framework net10.0 \
            --output "$RUNNER_TEMP/publish"
          cd "$RUNNER_TEMP/publish"
          zip -q -r "$RUNNER_TEMP/orleans-shopping-cart.zip" .

      - name: Sign in to Azure with OIDC
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infrastructure
        shell: bash
        env:
          AUTHENTICATION_CLIENT_SECRET: ${{ secrets.AUTHENTICATION_CLIENT_SECRET }}
        run: |
          case "$APP_SERVICE_OS" in
            windows|linux) ;;
            *)
              echo "AZURE_APP_SERVICE_OS must be 'windows' or 'linux'." >&2
              exit 1
              ;;
          esac

          outputs=$(az deployment group create \
            --name "orleans-shopping-cart-${GITHUB_RUN_ID}" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --template-file "samples/Deployment/AzureAppService/infra/${APP_SERVICE_OS}/main.bicep" \
            --parameters \
              appName="$APP_NAME" \
              allowSharedKeyAccess=false \
              assignStorageRoles=false \
              authenticationClientId="$AUTHENTICATION_CLIENT_ID" \
              authenticationClientSecret="$AUTHENTICATION_CLIENT_SECRET" \
              authenticationTenantId="$AUTHENTICATION_TENANT_ID" \
              location="$AZURE_RESOURCE_GROUP_LOCATION" \
            --query properties.outputs \
            --output json)

          echo "production_host=$(jq -r '.productionDefaultHostName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "staging_host=$(jq -r '.stagingDefaultHostName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "staging_slot=$(jq -r '.stagingSlotName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"

      - name: Deploy staging slot
        shell: bash
        run: |
          az webapp deploy \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --slot "${{ steps.infrastructure.outputs.staging_slot }}" \
            --type zip \
            --src-path "$RUNNER_TEMP/orleans-shopping-cart.zip" \
            --clean true \
            --restart true

      - name: Wait for staging readiness
        shell: bash
        run: |
          curl \
            --fail \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 10 \
            "https://${{ steps.infrastructure.outputs.staging_host }}/health/ready"

      - name: Swap staging into production
        shell: bash
        run: |
          az webapp deployment slot swap \
            --name "$APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --slot "${{ steps.infrastructure.outputs.staging_slot }}" \
            --target-slot production

      - name: Verify production readiness
        shell: bash
        run: |
          curl \
            --fail \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 10 \
            "https://${{ steps.infrastructure.outputs.production_host }}/health/ready"
