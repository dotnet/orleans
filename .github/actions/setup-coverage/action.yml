name: Setup code coverage
description: Install the cross-platform dependencies and tool used to collect CI coverage.

runs:
  using: composite
  steps:
  - name: Install Linux coverage dependencies
    if: runner.os == 'Linux'
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install --yes libxml2
  - name: Install dotnet-coverage
    shell: pwsh
    run: |
      $toolPath = Join-Path $env:GITHUB_WORKSPACE '.tools'
      dotnet tool install --tool-path $toolPath dotnet-coverage --version $env:DOTNET_COVERAGE_VERSION
      $toolPath >> $env:GITHUB_PATH
