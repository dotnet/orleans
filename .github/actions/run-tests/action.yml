name: Run tests
description: Set up, run, cover, and archive a trait-selected CI test partition.

inputs:
  artifact-name:
    description: Test output artifact name.
    required: true
  filter-query:
    description: Optional Microsoft Testing Platform query filter.
    required: false
    default: ''
  framework:
    description: Target framework.
    required: true
  provider:
    description: Provider trait selected by the standard CI filter.
    required: false
    default: ''
  prebuild-solution:
    description: Build the complete solution before running tests.
    required: false
    default: 'false'
  retry:
    description: Retry the test partition once after a failure.
    required: false
    default: 'false'
  static-instrumentation:
    description: Use static coverage instrumentation.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
  - uses: ./.github/actions/setup-test-environment
  - name: Build
    if: inputs.prebuild-solution == 'true'
    shell: pwsh
    run: dotnet build Orleans.slnx -p:ContinuousIntegrationBuild=false
  - name: Test
    id: test
    continue-on-error: ${{ inputs.retry == 'true' }}
    uses: ./.github/actions/dotnet-test
    with:
      coverage-id: ${{ inputs.artifact-name }}
      filter-query: ${{ inputs.filter-query || format('/[(Provider={0})&((Suite=BVT)|(Suite=SlowBVT)|(Suite=Functional))&(Category!=Performance)&(Category!=Stress)]', inputs.provider) }}
      framework: ${{ inputs.framework }}
      no-build: ${{ inputs.prebuild-solution }}
      result-id: ${{ inputs.retry == 'true' && format('{0}-attempt1', inputs.artifact-name) || inputs.artifact-name }}
      static-instrumentation: ${{ inputs.static-instrumentation }}
  - name: Retry tests
    if: inputs.retry == 'true' && steps.test.outcome == 'failure'
    uses: ./.github/actions/dotnet-test
    with:
      coverage-id: ${{ inputs.artifact-name }}
      filter-query: ${{ inputs.filter-query || format('/[(Provider={0})&((Suite=BVT)|(Suite=SlowBVT)|(Suite=Functional))&(Category!=Performance)&(Category!=Stress)]', inputs.provider) }}
      framework: ${{ inputs.framework }}
      no-build: ${{ inputs.prebuild-solution }}
      result-id: ${{ format('{0}-attempt2', inputs.artifact-name) }}
      static-instrumentation: ${{ inputs.static-instrumentation }}
  - name: Archive test results
    if: always()
    uses: ./.github/actions/archive-test-results
    with:
      name: ${{ inputs.artifact-name }}
