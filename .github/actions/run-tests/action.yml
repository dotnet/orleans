name: Run tests
description: Set up, run, cover, and archive a standard CI test partition.

inputs:
  artifact-name:
    description: Test output artifact name.
    required: true
  coverage-id:
    description: Unique coverage report identifier.
    required: true
  filter-query:
    description: Microsoft Testing Platform query filter.
    required: true
  framework:
    description: Target framework.
    required: true
  modules:
    description: Optional semicolon-separated prebuilt test module paths.
    required: false
    default: ''
  projects:
    description: Optional semicolon-separated test project paths.
    required: false
    default: ''
  report-trx-filename:
    description: TRX report filename template.
    required: true

runs:
  using: composite
  steps:
  - uses: ./.github/actions/setup-test-environment
  - name: Test
    shell: pwsh
    run: >
      ./.github/scripts/run-test-projects.ps1
      -CoverageId "${{ inputs.coverage-id }}"
      -Framework "${{ inputs.framework }}"
      -FilterQuery "${{ inputs.filter-query }}"
      -Modules "${{ inputs.modules }}"
      -Projects "${{ inputs.projects }}"
      -ReportTrxFilename "${{ inputs.report-trx-filename }}"
  - name: Archive test results
    if: always()
    uses: ./.github/actions/archive-test-results
    with:
      name: ${{ inputs.artifact-name }}
