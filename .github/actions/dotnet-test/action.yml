name: Run dotnet test
description: Run a trait-selected solution test partition with optional coverage.

inputs:
  coverage-id:
    description: Unique coverage report identifier.
    required: true
  coverage:
    description: Collect coverage for this test partition.
    required: false
    default: 'false'
  filter-query:
    description: Microsoft Testing Platform query filter.
    required: true
  framework:
    description: Target framework.
    required: true
  max-parallel-test-modules:
    description: Maximum number of test modules to execute concurrently.
    required: false
    default: '1'
  result-id:
    description: Unique test result identifier.
    required: true
runs:
  using: composite
  steps:
  - name: Prepare runtime crash diagnostics
    if: runner.os == 'Linux' && inputs.framework == 'net8.0'
    shell: pwsh
    run: |
      New-Item -ItemType Directory -Force -Path '${{ github.workspace }}/TestResults' | Out-Null
      @(
        'DOTNET_DbgEnableMiniDump=1'
        'DOTNET_DbgMiniDumpType=2'
        'DOTNET_DbgMiniDumpName=${{ github.workspace }}/TestResults/dotnet-test.%p.dmp'
        'DOTNET_CreateDumpDiagnostics=1'
      ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
  - name: Prepare coverage report
    if: inputs.coverage == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    shell: pwsh
    run: ./.github/scripts/coverage-report.ps1 -Action Prepare -CoverageId "${{ inputs.coverage-id }}"
  - name: Test
    if: inputs.coverage != 'true' || (github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)))
    shell: pwsh
    run: dotnet test --solution Orleans.slnx --framework "${{ inputs.framework }}" --filter-query "${{ inputs.filter-query }}" --minimum-expected-tests 1 --hangdump --hangdump-timeout 10m --crashdump --crashdump-type Full --hangdump-type Full --report-trx --report-trx-filename "test_results_${{ inputs.result-id }}_{asm}_{tfm}_{arch}.trx" --max-parallel-test-modules "${{ inputs.max-parallel-test-modules }}"
  - name: Test with coverage
    if: inputs.coverage == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    shell: pwsh
    run: |
      $command = @(
        'dotnet'
        'test'
        '--solution'
        'Orleans.slnx'
        '--framework'
        '${{ inputs.framework }}'
        '--filter-query'
        '${{ inputs.filter-query }}'
        '--minimum-expected-tests'
        '1'
        '--hangdump'
        '--hangdump-timeout'
        '10m'
        '--crashdump'
        '--crashdump-type'
        'Full'
        '--hangdump-type'
        'Full'
        '--report-trx'
        '--report-trx-filename'
        'test_results_${{ inputs.result-id }}_{asm}_{tfm}_{arch}.trx'
        '--max-parallel-test-modules'
        '${{ inputs.max-parallel-test-modules }}'
      )
      ./.github/scripts/invoke-coverage.ps1 -Settings ./.github/coverage.config.xml -Output "TestResults/${{ inputs.coverage-id }}.cobertura.xml" -RetryLogFile "logs/${{ inputs.coverage-id }}.retry.log" -Command $command
  - name: Validate coverage report
    if: inputs.coverage == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    shell: pwsh
    run: ./.github/scripts/coverage-report.ps1 -Action Validate -CoverageId "${{ inputs.coverage-id }}"
