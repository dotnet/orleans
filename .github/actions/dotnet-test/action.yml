name: Run dotnet test
description: Run a trait-selected solution test partition with optional coverage.

inputs:
  coverage-id:
    description: Unique coverage report identifier.
    required: true
  coverage:
    description: Collect coverage for this test partition.
    required: false
    default: 'false'
  filter-query:
    description: Microsoft Testing Platform query filter.
    required: true
  framework:
    description: Target framework.
    required: true
  result-id:
    description: Unique test result identifier.
    required: true
runs:
  using: composite
  steps:
  - name: Prepare coverage report
    if: inputs.coverage == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    shell: pwsh
    run: ./.github/scripts/coverage-report.ps1 -Action Prepare -CoverageId "${{ inputs.coverage-id }}"
  - name: Test
    if: inputs.coverage != 'true' || (github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)))
    shell: pwsh
    run: dotnet test --solution Orleans.slnx --framework "${{ inputs.framework }}" --filter-query "${{ inputs.filter-query }}" --minimum-expected-tests 1 --hangdump --hangdump-timeout 10m --crashdump --crashdump-type Full --hangdump-type Full --report-trx --report-trx-filename "test_results_${{ inputs.result-id }}_{asm}_{tfm}_{arch}.trx" --max-parallel-test-modules 1
  - name: Test with coverage
    if: inputs.coverage == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    shell: pwsh
    run: |
      $command = @(
        'dotnet'
        'test'
        '--solution'
        'Orleans.slnx'
        '--framework'
        '${{ inputs.framework }}'
        '--filter-query'
        '${{ inputs.filter-query }}'
        '--minimum-expected-tests'
        '1'
        '--hangdump'
        '--hangdump-timeout'
        '10m'
        '--crashdump'
        '--crashdump-type'
        'Full'
        '--hangdump-type'
        'Full'
        '--report-trx'
        '--report-trx-filename'
        'test_results_${{ inputs.result-id }}_{asm}_{tfm}_{arch}.trx'
        '--max-parallel-test-modules'
        '1'
      )
      ./.github/scripts/invoke-coverage.ps1 -Settings ./.github/coverage.config.xml -Output "TestResults/${{ inputs.coverage-id }}.cobertura.xml" -RetryLogFile "logs/${{ inputs.coverage-id }}.retry.log" -Command $command
  - name: Validate coverage report
    if: inputs.coverage == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    shell: pwsh
    run: ./.github/scripts/coverage-report.ps1 -Action Validate -CoverageId "${{ inputs.coverage-id }}"
