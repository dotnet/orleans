name: Setup test environment
description: Install the .NET SDK and trusted comparison coverage tooling.

inputs:
  coverage:
    description: Install coverage tooling for this test partition.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
  - name: Setup .NET
    uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
    with:
      global-json-file: global.json
  - name: Setup code coverage
    if: inputs.coverage == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    uses: ./.github/actions/setup-coverage
