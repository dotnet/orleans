name: Restore provider test assets
description: Download prebuilt provider test applications into their repository paths.

inputs:
  name:
    description: Provider test build artifact name.
    required: true

runs:
  using: composite
  steps:
  - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
    with:
      name: ${{ inputs.name }}
      path: .
