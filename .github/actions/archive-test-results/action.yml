name: Archive test results
description: Upload diagnostics and coverage produced by the selected test partition.

inputs:
  coverage:
    description: Archive coverage for this test partition.
    required: false
    default: 'false'
  name:
    description: Artifact name.
    required: true
  retention-days:
    description: Number of days to retain test diagnostics.
    required: false
    default: '1'

runs:
  using: composite
  steps:
  - id: archive-test-results
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
    continue-on-error: true
    with:
      name: ${{ inputs.name }}
      if-no-files-found: warn
      retention-days: ${{ inputs['retention-days'] }}
      path: |
        **/TestResults/*
        !TestResults/*.cobertura.xml
        !TestResults/*.coverage.json
        **/logs/*
  - name: Report test result upload failure
    if: steps.archive-test-results.outcome == 'failure'
    shell: pwsh
    run: Write-Output '::warning title=Test result artifact upload failed::Test result diagnostics are unavailable. See the preceding upload error.'
  - name: Write coverage metadata
    if: inputs.coverage == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    shell: pwsh
    run: |
      $metadata = [ordered]@{
         artifact_name = 'coverage_${{ inputs.name }}'
         commit_sha = $env:GITHUB_SHA
         coverage_id = '${{ inputs.name }}'
         format_version = 1
      }
      $metadata |
         ConvertTo-Json |
         Set-Content -LiteralPath 'TestResults/${{ inputs.name }}.coverage.json' -Encoding utf8NoBOM
  - name: Archive coverage
    id: archive-coverage
    if: inputs.coverage == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    continue-on-error: true
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
    with:
      name: coverage_${{ inputs.name }}-attempt-${{ github.run_attempt }}
      if-no-files-found: error
      retention-days: ${{ github.event_name == 'push' && 7 || 1 }}
      path: |
        TestResults/${{ inputs.name }}.cobertura.xml
        TestResults/${{ inputs.name }}.coverage.json
  - name: Wait before retrying coverage upload
    if: steps.archive-coverage.outcome == 'failure'
    shell: pwsh
    run: Start-Sleep -Seconds 30
  - name: Report coverage upload retry
    if: steps.archive-coverage.outcome == 'failure'
    shell: pwsh
    run: Write-Output '::warning title=Coverage artifact upload failed::Retrying the coverage upload under a distinct immutable artifact name.'
  - name: Retry coverage upload
    if: steps.archive-coverage.outcome == 'failure'
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
    with:
      name: coverage_${{ inputs.name }}-attempt-${{ github.run_attempt }}-retry
      if-no-files-found: error
      retention-days: ${{ github.event_name == 'push' && 7 || 1 }}
      path: |
        TestResults/${{ inputs.name }}.cobertura.xml
        TestResults/${{ inputs.name }}.coverage.json
