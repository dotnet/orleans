name: Archive test results
description: Upload diagnostics and require a coverage report for pull requests.

inputs:
  name:
    description: Artifact name.
    required: true

runs:
  using: composite
  steps:
  - id: archive-test-results
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
    continue-on-error: true
    with:
      name: ${{ inputs.name }}
      if-no-files-found: warn
      retention-days: 1
      path: |
        **/TestResults/*
        !TestResults/*.cobertura.xml
        !TestResults/*.coverage.json
        **/logs/*
  - name: Wait before retrying test result upload
    if: steps.archive-test-results.outcome == 'failure'
    shell: pwsh
    run: Start-Sleep -Seconds 30
  - name: Retry test result upload
    if: steps.archive-test-results.outcome == 'failure'
    continue-on-error: true
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
    with:
      name: ${{ inputs.name }}
      if-no-files-found: warn
      retention-days: 1
      overwrite: true
      path: |
        **/TestResults/*
        !TestResults/*.cobertura.xml
        !TestResults/*.coverage.json
        **/logs/*
  - name: Write coverage metadata
    if: github.event_name == 'pull_request'
    shell: pwsh
    run: |
      $metadata = [ordered]@{
         artifact_name = 'coverage_${{ inputs.name }}'
         commit_sha = $env:GITHUB_SHA
         coverage_id = '${{ inputs.name }}'
         format_version = 1
      }
      $metadata |
         ConvertTo-Json |
         Set-Content -LiteralPath 'TestResults/${{ inputs.name }}.coverage.json' -Encoding utf8NoBOM
  - name: Archive coverage
    id: archive-coverage
    if: github.event_name == 'pull_request'
    continue-on-error: true
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
    with:
      name: coverage_${{ inputs.name }}
      if-no-files-found: error
      retention-days: 1
      path: |
        TestResults/${{ inputs.name }}.cobertura.xml
        TestResults/${{ inputs.name }}.coverage.json
  - name: Wait before retrying coverage upload
    if: github.event_name == 'pull_request' && steps.archive-coverage.outcome == 'failure'
    shell: pwsh
    run: Start-Sleep -Seconds 30
  - name: Retry coverage upload
    if: github.event_name == 'pull_request' && steps.archive-coverage.outcome == 'failure'
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
    with:
      name: coverage_${{ inputs.name }}
      if-no-files-found: error
      retention-days: 1
      overwrite: true
      path: |
        TestResults/${{ inputs.name }}.cobertura.xml
        TestResults/${{ inputs.name }}.coverage.json
