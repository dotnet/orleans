name: Scoped RPC cancellation
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rpc-cancellation.yml
      - src/Orleans.Core/Runtime/CancellationAcknowledgementScope.cs
      - src/Orleans.Core/Runtime/CallbackData.cs
      - src/Orleans.Core/Runtime/GrainReferenceRuntime.cs
      - src/Orleans.Core/Runtime/IRuntimeClient.cs
      - src/Orleans.Core/Runtime/OutgoingCallInvoker.cs
      - src/Orleans.Core/Runtime/OutsideRuntimeClient.cs
      - src/Orleans.Runtime/Core/InsideRuntimeClient.cs
      - test/Orleans.Runtime.Tests/CallbackDataTests.cs
      - test/Orleans.Runtime.Tests/CancellationTests/**
permissions:
  contents: read
jobs:
  scoped-cancellation:
    name: Scoped cancellation (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Run focused callback and generated-proxy regressions
        shell: pwsh
        run: >-
          dotnet test --project test/Orleans.Runtime.Tests/Orleans.Runtime.Tests.csproj
          --framework "${{ matrix.framework }}"
          --filter-query "/*/Tester/(CallbackDataTests)|(CancellationAcknowledgementScopeTests)|(ScopedCancellationRpcTests)"
          --minimum-expected-tests 29
          --report-trx
          --report-trx-filename "scoped-cancellation-${{ matrix.framework }}.trx"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: scoped-cancellation-${{ matrix.framework }}
          retention-days: 7
          path: |
            **/TestResults/*.trx
