name: Test results reporting
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/download-test-results.ps1
      - .github/scripts/publish-test-results.ps1
      - .github/scripts/test-test-results.ps1
      - .github/workflows/test-results.yml
      - .github/workflows/test-test-results.yml
  push:
    branches:
      - main
    paths:
      - .github/scripts/download-test-results.ps1
      - .github/scripts/publish-test-results.ps1
      - .github/scripts/test-test-results.ps1
      - .github/workflows/test-results.yml
      - .github/workflows/test-test-results.yml
permissions:
  contents: read
jobs:
  selection:
    name: Test result selection (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Test artifact selection and reporting
        shell: pwsh
        run: ./.github/scripts/test-test-results.ps1
