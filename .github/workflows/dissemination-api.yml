name: Dissemination API generation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dissemination-api.yml
      - src/Orleans.Core.Abstractions/IDs/SiloAddress.cs
      - src/Orleans.Core/Configuration/Options/DisseminationOptions.cs
      - src/Orleans.Core/Configuration/Options/ClusterMembershipOptions.cs
      - src/Orleans.Runtime/Configuration/Options/DeploymentLoadPublisherOptions.cs

permissions:
  contents: read

concurrency:
  group: dissemination-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json
      - name: Generate affected public API surfaces
        shell: bash
        run: |
          set -euo pipefail
          export CI=false
          for name in Orleans.Core.Abstractions Orleans.Core Orleans.Runtime; do
            project="src/$name/$name.csproj"
            dotnet restore "$project" --configfile .github/NuGet.GenAPI.Config -p:GenerateOrleansApiSource=true
            dotnet build "$project" --framework net8.0 --configuration Release --no-incremental --no-restore -p:GenerateOrleansApiSource=true '/t:Build;GenAPIGenerateReferenceAssemblySource' "-bl:genapi-$name.binlog"
          done
      - name: Upload exact generated surfaces
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dissemination-generated-api
          path: |
            src/api/Orleans.Core.Abstractions/Orleans.Core.Abstractions.cs
            src/api/Orleans.Core/Orleans.Core.cs
            src/api/Orleans.Runtime/Orleans.Runtime.cs
          if-no-files-found: error
          retention-days: 7
      - name: Upload generation diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dissemination-api-binlogs
          path: genapi-*.binlog
          retention-days: 7
