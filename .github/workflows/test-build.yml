name: Build script regressions
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - build.ps1
      - common.ps1
      - Build.cmd
      - .github/scripts/test-build.ps1
      - .github/workflows/test-build.yml
  push:
    branches:
      - main
    paths:
      - build.ps1
      - common.ps1
      - Build.cmd
      - .github/scripts/test-build.ps1
      - .github/workflows/test-build.yml
permissions:
  contents: read
jobs:
  script:
    name: Build orchestration (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Test build commands and versions
        shell: ${{ matrix.shell }}
        run: .\.github\scripts\test-build.ps1
