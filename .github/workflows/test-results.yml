name: .NET Test Results

on:
  workflow_run:
    workflows:
      - .NET CI
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  report:
    name: Report test results
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    permissions:
      contents: read
      actions: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out reporting scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test_output_*
          path: test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish test results
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_COMMIT: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: >
          ./.github/scripts/publish-test-results.ps1
          -ResultsPath test-results
          -Repository ${{ github.repository }}
          -Sha $env:TEST_COMMIT
          -DetailsUrl $env:TEST_RUN_URL
  coverage:
    name: Report code coverage
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
      checks: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted reporter
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Test coverage reporting
        shell: pwsh
        run: ./.github/scripts/test-summarize-coverage.ps1
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: coverage_output
          path: coverage
          run-id: ${{ github.event.workflow_run.id }}
      - name: Summarize coverage
        id: coverage
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          ./.github/scripts/summarize-coverage.ps1 `
            -ReportDirectory coverage `
            -SourceRoot "$env:GITHUB_WORKSPACE/src" `
            -MarkdownOutput coverage-summary.md `
            -JsonOutput coverage-summary.json

          $coverage = Get-Content -Raw coverage-summary.json | ConvertFrom-Json
          $culture = [Globalization.CultureInfo]::InvariantCulture
          $coveredLines = $coverage.covered_lines.ToString('N0', $culture)
          $totalLines = $coverage.total_lines.ToString('N0', $culture)
          $sourceFiles = $coverage.source_files.ToString('N0', $culture)
          $comment = @(
            '<!-- orleans-code-coverage -->'
            '## Code coverage'
            ''
            ('**{0} line coverage** - **{1} / {2} lines**' -f $coverage.line_rate_display, $coveredLines, $totalLines)
            ''
            '<details>'
            '<summary>Coverage details</summary>'
            ''
            ('- **Source files:** {0}' -f $sourceFiles)
            '- **Scope:** every CI test matrix job, including providers, CodeGen, .NET 8/10, Linux, Windows, and macOS'
            '- **Sources:** maintained repository code under `src/` loaded by the complete CI test scope'
            ('- **Commit:** [`{0}`]({1}/commit/{2})' -f $env:HEAD_SHA.Substring(0, 10), $env:REPOSITORY_URL, $env:HEAD_SHA)
            ('- [View the test run and merged coverage artifact]({0})' -f $env:SOURCE_RUN_URL)
            ('- [View the coverage reporting run]({0})' -f $env:REPORT_RUN_URL)
            ''
            '</details>'
          ) -join "`n"
          Set-Content -LiteralPath coverage-comment.md -Value $comment -Encoding utf8NoBOM

          Get-Content -Raw coverage-summary.md >> $env:GITHUB_STEP_SUMMARY
          "line-rate=$($coverage.line_rate_display)" >> $env:GITHUB_OUTPUT
      - name: Publish coverage check
        env:
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXTERNAL_ID: coverage-${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LINE_RATE: ${{ steps.coverage.outputs.line-rate }}
        run: |
          jq -n \
           --arg details_url "$DETAILS_URL" \
           --arg external_id "$EXTERNAL_ID" \
           --arg head_sha "$HEAD_SHA" \
           --arg title "Line coverage: $LINE_RATE" \
           --rawfile summary coverage-summary.md \
           '{
             name: "Code Coverage",
             head_sha: $head_sha,
             status: "completed",
             conclusion: "success",
             details_url: $details_url,
             external_id: $external_id,
             output: {
               title: $title,
               summary: $summary
             }
           }' > coverage-check.json

          check_id="$(
           gh api \
             -H "Accept: application/vnd.github+json" \
             -H "X-GitHub-Api-Version: 2022-11-28" \
             "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=Code%20Coverage&per_page=100" \
             --jq ".check_runs[] | select(.external_id == \"$EXTERNAL_ID\") | .id" |
             head -n 1
          )"

          if [[ -n "$check_id" ]]; then
           jq 'del(.head_sha)' coverage-check.json > coverage-check-update.json
           gh api \
             --method PATCH \
             -H "Accept: application/vnd.github+json" \
             -H "X-GitHub-Api-Version: 2022-11-28" \
             "repos/$GITHUB_REPOSITORY/check-runs/$check_id" \
             --input coverage-check-update.json
          else
           gh api \
             --method POST \
             -H "Accept: application/vnd.github+json" \
             -H "X-GitHub-Api-Version: 2022-11-28" \
             "repos/$GITHUB_REPOSITORY/check-runs" \
             --input coverage-check.json
          fi
      - name: Publish coverage comment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $head = "$env:HEAD_OWNER`:$env:HEAD_BRANCH"
          $pullRequests = gh api `
            --method GET `
            "repos/$env:GITHUB_REPOSITORY/pulls" `
            -f state=all `
            -f "head=$head" `
            -f sort=updated `
            -f direction=desc `
            -f per_page=10 |
            ConvertFrom-Json
          $pullRequest = @($pullRequests | Where-Object { $_.head.sha -eq $env:HEAD_SHA })[0]
          if (-not $pullRequest) {
            $pullRequest = @($pullRequests)[0]
          }
          if (-not $pullRequest) {
            throw "No pull request found for $head"
          }
          $prNumber = $pullRequest.number

          $marker = '<!-- orleans-code-coverage -->'
          $commentIds = @(
            gh api `
              --paginate `
              "repos/$env:GITHUB_REPOSITORY/issues/$prNumber/comments?per_page=100" `
              --jq ".[] | select(.user.login == `"github-actions[bot]`" and (.body | contains(`"$marker`"))) | .id"
          )
          $payload = @{
            body = Get-Content -Raw coverage-comment.md
          } | ConvertTo-Json
          Set-Content -LiteralPath coverage-comment.json -Value $payload -Encoding utf8NoBOM

          if ($commentIds.Count -gt 0) {
            gh api `
              --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/issues/comments/$($commentIds[0])" `
              --input coverage-comment.json
          } else {
            gh api `
              --method POST `
              "repos/$env:GITHUB_REPOSITORY/issues/$prNumber/comments" `
              --input coverage-comment.json
          }
