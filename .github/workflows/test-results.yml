name: .NET Test Results

on:
  workflow_run:
    workflows:
      - .NET CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    name: Report test results
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Check out reporting scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test_output_*
          path: test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish test results
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_COMMIT: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: >
          ./.github/scripts/publish-test-results.ps1
          -ResultsPath test-results
          -Repository ${{ github.repository }}
          -Sha $env:TEST_COMMIT
          -DetailsUrl $env:TEST_RUN_URL
  coverage:
    name: Report code coverage
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted reporter
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          pattern: coverage_output_*
          path: coverage
          merge-multiple: false
          run-id: ${{ github.event.workflow_run.id }}
      - name: Summarize coverage
        id: coverage
        run: |
          python .github/scripts/summarize-coverage.py coverage \
           --source-root "$GITHUB_WORKSPACE/src" \
           --markdown-output coverage-summary.md \
           --json-output coverage-summary.json
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "line-rate=$(jq -r .line_rate_display coverage-summary.json)" >> "$GITHUB_OUTPUT"
      - name: Publish coverage check
        env:
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXTERNAL_ID: coverage-${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LINE_RATE: ${{ steps.coverage.outputs.line-rate }}
        run: |
          jq -n \
           --arg details_url "$DETAILS_URL" \
           --arg external_id "$EXTERNAL_ID" \
           --arg head_sha "$HEAD_SHA" \
           --arg title "Line coverage: $LINE_RATE" \
           --rawfile summary coverage-summary.md \
           '{
             name: "Code Coverage",
             head_sha: $head_sha,
             status: "completed",
             conclusion: "success",
             details_url: $details_url,
             external_id: $external_id,
             output: {
               title: $title,
               summary: $summary
             }
           }' > coverage-check.json

          check_id="$(
           gh api \
             -H "Accept: application/vnd.github+json" \
             -H "X-GitHub-Api-Version: 2022-11-28" \
             "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=Code%20Coverage&per_page=100" \
             --jq ".check_runs[] | select(.external_id == \"$EXTERNAL_ID\") | .id" |
             head -n 1
          )"

          if [[ -n "$check_id" ]]; then
           jq 'del(.head_sha)' coverage-check.json > coverage-check-update.json
           gh api \
             --method PATCH \
             -H "Accept: application/vnd.github+json" \
             -H "X-GitHub-Api-Version: 2022-11-28" \
             "repos/$GITHUB_REPOSITORY/check-runs/$check_id" \
             --input coverage-check-update.json
          else
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/check-runs" \
            --input coverage-check.json
          fi
