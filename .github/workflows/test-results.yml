name: .NET Test Results

on:
  workflow_run:
    workflows:
      - .NET CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    name: Report test results
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Check out reporting scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test_output_*
          path: test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish test results
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_COMMIT: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: >
          ./.github/scripts/publish-test-results.ps1
          -ResultsPath test-results
          -Repository ${{ github.repository }}
          -Sha $env:TEST_COMMIT
          -DetailsUrl $env:TEST_RUN_URL
