name: Generate membership provider APIs

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - .github/workflows/generate-membership-api.yml

permissions:
  contents: read

jobs:
  generate:
    if: github.event.pull_request.number == 11237
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            project: src\Orleans.Core\Orleans.Core.csproj
            api: src/api/Orleans.Core/Orleans.Core.cs
          - name: adonet
            project: src\AdoNet\Orleans.Clustering.AdoNet\Orleans.Clustering.AdoNet.csproj
            api: src/api/AdoNet/Orleans.Clustering.AdoNet/Orleans.Clustering.AdoNet.cs
          - name: consul
            project: src\Orleans.Clustering.Consul\Orleans.Clustering.Consul.csproj
            api: src/api/Orleans.Clustering.Consul/Orleans.Clustering.Consul.cs
          - name: zookeeper
            project: src\Orleans.Clustering.ZooKeeper\Orleans.Clustering.ZooKeeper.csproj
            api: src/api/Orleans.Clustering.ZooKeeper/Orleans.Clustering.ZooKeeper.cs
          - name: dynamodb-transactions
            project: src\AWS\Orleans.Transactions.DynamoDB\Orleans.Transactions.DynamoDB.csproj
            api: src/api/AWS/Orleans.Transactions.DynamoDB/Orleans.Transactions.DynamoDB.cs
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          global-json-file: global.json
      - name: Generate provider API
        run: |
          dotnet restore '${{ matrix.project }}' --configfile .github\NuGet.GenAPI.Config -p:GenerateOrleansApiSource=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build '${{ matrix.project }}' --framework net8.0 --configuration Release --no-incremental --no-restore -p:GenerateOrleansApiSource=true /t:"Build;GenAPIGenerateReferenceAssemblySource"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: membership-provider-api-${{ matrix.name }}
          path: ${{ matrix.api }}
          if-no-files-found: error
          retention-days: 1
