name: Dissemination performance bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: dotnet/orleans
          ref: 6739589254b746a8790cf53524e6abe372bb53d4
          path: .dissemination-runtime-original
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ReubenBond/orleans
          ref: 3fc0a4610cd2eb5feef27e958fcca59658aaae47
          path: .dissemination-runtime-candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json
      - name: Check script boundaries
        shell: pwsh
        run: ./.github/scripts/test-dissemination-performance.ps1
      - name: Build and measure bounded all-path workloads
        shell: pwsh
        run: |
          ./.github/scripts/dissemination-performance.ps1 `
            -CandidateRepository ReubenBond/orleans `
            -CandidateRef 3fc0a4610cd2eb5feef27e958fcca59658aaae47 `
            -Sizes '4,8' -Iterations 3 -Repetitions 2 -RuntimePaths All `
            -Scenarios 'stable,churn,partition' -SiloProcessorCount 0 -GCConserveMemory 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dissemination-performance-results
          retention-days: 30
          path: |
            Artifacts/DisseminationPerformance/results
            Artifacts/DisseminationPerformance/*.binlog
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dissemination-performance-binaries
          retention-days: 7
          path: Artifacts/DisseminationPerformance/bin
